<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Independent Directors Data Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // ===== UTILITY FUNCTIONS =====
        /**
         * Validates director form data
         * @param {Object} formData - Form data to validate
         * @returns {Object} - Validation result { isValid: boolean, errors: string[] }
         */
        const validateDirectorForm = (formData) => {
            const errors = [];
            
            if (!formData.name || formData.name.trim().length < 2) {
                errors.push('Name must be at least 2 characters long');
            }
            
            if (!formData.role || formData.role.trim().length < 2) {
                errors.push('Role/Expertise must be at least 2 characters long');
            }
            
            if (formData.bio && formData.bio.trim().length > 500) {
                errors.push('Bio must not exceed 500 characters');
            }
            
            return {
                isValid: errors.length === 0,
                errors
            };
        };

        /**
         * Sanitizes input to prevent XSS attacks
         * @param {string} input - User input to sanitize
         * @returns {string} - Sanitized input
         */
        const sanitizeInput = (input) => {
            if (typeof input !== 'string') return '';
            return input
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#x27;');
        };

        // ===== INITIAL DATA =====
        const INITIAL_DIRECTORS = [
            { 
                id: 1, 
                name: 'Pawan Singh', 
                role: 'Financial & Corporate Governance Expert', 
                bio: 'Experienced director specializing in international risk management and strategic scaling.' 
            },
            { 
                id: 2, 
                name: 'Dr. Anita Sharma', 
                role: 'Technology & Digital Transformation', 
                bio: 'Expert in guiding corporate boards through cybersecurity, AI integration, and digital roadmaps.' 
            },
            { 
                id: 3, 
                name: 'Robert Chen', 
                role: 'ESG & Sustainability Leader', 
                bio: 'Advising global corporations on sustainable growth, ESG compliance, and board governance.' 
            }
        ];

        const INITIAL_FORM_DATA = { name: '', role: '', bio: '' };

        // ===== HEADER COMPONENT =====
        function Header({ activeTab, onTabChange }) {
            return (
                <header className="bg-white border-b border-slate-200 sticky top-0 z-50">
                    <div className="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
                        <div className="flex items-center space-x-3">
                            <div className="bg-indigo-900 text-white font-bold h-10 w-10 rounded-lg flex items-center justify-center text-lg">G</div>
                            <div>
                                <h1 className="font-bold text-slate-900 text-lg leading-tight">Global Independent</h1>
                                <p className="text-xs text-slate-500 font-medium tracking-wider uppercase">Directors Data Bank</p>
                            </div>
                        </div>
                        <nav className="flex space-x-3">
                            <button 
                                onClick={() => onTabChange('directory')}
                                className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'directory' ? 'bg-indigo-50 text-indigo-900' : 'text-slate-600 hover:text-indigo-900'}`}
                                aria-label="Go to directory"
                            >
                                Directory
                            </button>
                            <button 
                                onClick={() => onTabChange('register')}
                                className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'register' ? 'bg-indigo-900 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
                                aria-label="Go to registration"
                            >
                                Register Profile
                            </button>
                        </nav>
                    </div>
                </header>
            );
        }

        // ===== HERO SECTION COMPONENT =====
        function HeroSection() {
            return (
                <section className="bg-indigo-950 text-white py-16 px-6 text-center">
                    <div className="max-w-3xl mx-auto">
                        <h2 className="text-3xl md:text-4xl font-extrabold tracking-tight mb-3">Connecting Elite Board Leadership</h2>
                        <p className="text-indigo-200 text-base md:text-lg">A streamlined platform linking qualified independent directors with forward-thinking governance boards.</p>
                    </div>
                </section>
            );
        }

        // ===== DIRECTOR CARD COMPONENT =====
        function DirectorCard({ director, onViewProfile }) {
            return (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between hover:border-indigo-300 transition hover:shadow-md">
                    <div>
                        <div className="flex items-center justify-between mb-2">
                            <h4 className="font-bold text-slate-900 text-lg">{director.name}</h4>
                            <span className="bg-emerald-50 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-medium">Verified</span>
                        </div>
                        <p className="text-xs text-indigo-600 font-semibold mb-3">{director.role}</p>
                        <p className="text-slate-600 text-sm leading-relaxed mb-6">{director.bio}</p>
                    </div>
                    <button 
                        onClick={() => onViewProfile(director.name)} 
                        className="w-full bg-slate-50 border border-slate-200 text-slate-700 px-4 py-2.5 rounded-lg hover:bg-slate-100 transition font-semibold text-sm"
                        aria-label={`View full profile for ${director.name}`}
                    >
                        View Full Profile
                    </button>
                </div>
            );
        }

        // ===== SEARCH & HEADER COMPONENT =====
        function SearchHeader({ searchQuery, onSearchChange, directorCount }) {
            return (
                <div className="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
                    <div>
                        <h3 className="text-2xl font-bold text-slate-900">Verified Directors Directory</h3>
                        <p className="text-slate-500 text-sm">Browse {directorCount} professional profiles ready for immediate board appointment.</p>
                    </div>
                    <div className="w-full md:w-80">
                        <input 
                            type="text" 
                            placeholder="Search by name or expertise..." 
                            value={searchQuery}
                            onChange={(e) => onSearchChange(e.target.value)}
                            className="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                            aria-label="Search directors"
                        />
                    </div>
                </div>
            );
        }

        // ===== DIRECTORY VIEW COMPONENT =====
        function DirectoryView({ directors, searchQuery, onSearchChange }) {
            const filteredDirectors = React.useMemo(() => {
                return directors.filter(d => 
                    d.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    d.role.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [directors, searchQuery]);

            const handleViewProfile = React.useCallback((directorName) => {
                alert(`Viewing full credentials for ${directorName}`);
            }, []);

            return (
                <div>
                    <SearchHeader 
                        searchQuery={searchQuery} 
                        onSearchChange={onSearchChange}
                        directorCount={filteredDirectors.length}
                    />

                    {filteredDirectors.length === 0 ? (
                        <div className="text-center py-16 bg-white rounded-xl border border-slate-200">
                            <p className="text-slate-500">No directors found matching your search.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {filteredDirectors.map((director) => (
                                <DirectorCard 
                                    key={director.id}
                                    director={director} 
                                    onViewProfile={handleViewProfile}
                                />
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ===== ERROR MESSAGE COMPONENT =====
        function ErrorMessage({ errors }) {
            if (errors.length === 0) return null;
            
            return (
                <div className="mb-6 bg-red-50 border border-red-200 rounded-lg p-4">
                    <p className="text-red-700 font-medium text-sm mb-2">Please fix the following errors:</p>
                    <ul className="list-disc list-inside space-y-1">
                        {errors.map((error, index) => (
                            <li key={index} className="text-red-600 text-sm">{error}</li>
                        ))}
                    </ul>
                </div>
            );
        }

        // ===== SUCCESS MESSAGE COMPONENT =====
        function SuccessMessage() {
            return (
                <div className="mb-6 bg-emerald-50 border border-emerald-200 text-emerald-700 p-4 rounded-lg text-sm text-center font-medium">
                    ✓ Profile registered successfully! Redirecting...
                </div>
            );
        }

        // ===== REGISTRATION FORM COMPONENT =====
        function RegistrationForm({ formData, onInputChange, onSubmit, isSubmitting, showSuccess, errors }) {
            return (
                <div className="max-w-xl mx-auto bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
                    <div className="text-center mb-6">
                        <h3 className="text-2xl font-bold text-slate-900">Director Registration Portal</h3>
                        <p className="text-slate-500 text-sm mt-1">Submit your details to list your profile on the data bank.</p>
                    </div>

                    {showSuccess && <SuccessMessage />}
                    {!showSuccess && <ErrorMessage errors={errors} />}

                    <form onSubmit={onSubmit} className="space-y-4">
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Full Name</label>
                            <input 
                                type="text" 
                                required 
                                value={formData.name}
                                onChange={(e) => onInputChange('name', e.target.value)}
                                className="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                                placeholder="e.g. Jane Doe"
                                maxLength="100"
                                aria-label="Full name"
                            />
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Area of Expertise / Role</label>
                            <input 
                                type="text" 
                                required 
                                value={formData.role}
                                onChange={(e) => onInputChange('role', e.target.value)}
                                className="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                                placeholder="e.g. Corporate Finance & Risk Management"
                                maxLength="150"
                                aria-label="Area of expertise"
                            />
                        </div>
                        <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Professional Summary / Bio</label>
                            <textarea 
                                rows="3"
                                value={formData.bio}
                                onChange={(e) => onInputChange('bio', e.target.value)}
                                className="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none" 
                                placeholder="Brief overview of your board experience..."
                                maxLength="500"
                                aria-label="Professional bio"
                            ></textarea>
                            <p className="text-xs text-slate-500 mt-1">{formData.bio.length}/500 characters</p>
                        </div>
                        <button 
                            type="submit" 
                            disabled={isSubmitting}
                            className="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition shadow-sm text-sm disabled:bg-slate-400 disabled:cursor-not-allowed"
                        >
                            {isSubmitting ? 'Submitting...' : 'Publish Registration'}
                        </button>
                    </form>
                </div>
            );
        }

        // ===== FOOTER COMPONENT =====
        function Footer() {
            return (
                <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-12">
                    <p>&copy; 2026 Global Independent Directors Data Bank. All rights reserved.</p>
                </footer>
            );
        }

        // ===== MAIN APP COMPONENT =====
        function App() {
            const [searchQuery, setSearchQuery] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('directory');
            const [directors, setDirectors] = React.useState(INITIAL_DIRECTORS);
            const [formData, setFormData] = React.useState(INITIAL_FORM_DATA);
            const [successMsg, setSuccessMsg] = React.useState(false);
            const [errorMsgs, setErrorMsgs] = React.useState([]);
            const [isSubmitting, setIsSubmitting] = React.useState(false);

            /**
             * Handle form input change
             * @param {string} field - Form field name
             * @param {string} value - New value
             */
            const handleInputChange = React.useCallback((field, value) => {
                setFormData(prevData => ({
                    ...prevData,
                    [field]: value
                }));
                // Clear errors when user starts typing
                if (errorMsgs.length > 0) {
                    setErrorMsgs([]);
                }
            }, [errorMsgs.length]);

            /**
             * Handle form submission
             * @param {Event} e - Form submit event
             */
            const handleSubmit = React.useCallback((e) => {
                e.preventDefault();
                
                try {
                    setIsSubmitting(true);
                    setErrorMsgs([]);

                    // Validate form data
                    const validation = validateDirectorForm(formData);
                    if (!validation.isValid) {
                        setErrorMsgs(validation.errors);
                        return;
                    }

                    // Create new director with sanitized data
                    const newDirector = {
                        id: Math.max(...directors.map(d => d.id), 0) + 1,
                        name: sanitizeInput(formData.name.trim()),
                        role: sanitizeInput(formData.role.trim()),
                        bio: sanitizeInput(formData.bio.trim() || 'Verified Independent Board Member.')
                    };

                    // Add new director to list
                    setDirectors(prevDirectors => [newDirector, ...prevDirectors]);
                    
                    // Reset form and show success message
                    setFormData(INITIAL_FORM_DATA);
                    setSuccessMsg(true);

                    // Auto-redirect after 2 seconds
                    setTimeout(() => {
                        setSuccessMsg(false);
                        setActiveTab('directory');
                        setIsSubmitting(false);
                    }, 2000);

                } catch (error) {
                    setErrorMsgs(['An unexpected error occurred. Please try again.']);
                    setIsSubmitting(false);
                }
            }, [formData, directors]);

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        <Header activeTab={activeTab} onTabChange={setActiveTab} />
                        <HeroSection />

                        <main className="max-w-7xl mx-auto px-6 py-12">
                            {activeTab === 'directory' ? (
                                <DirectoryView 
                                    directors={directors} 
                                    searchQuery={searchQuery} 
                                    onSearchChange={setSearchQuery}
                                />
                            ) : (
                                <RegistrationForm 
                                    formData={formData}
                                    onInputChange={handleInputChange}
                                    onSubmit={handleSubmit}
                                    isSubmitting={isSubmitting}
                                    showSuccess={successMsg}
                                    errors={errorMsgs}
                                />
                            )}
                        </main>
                    </div>

                    <Footer />
                </div>
            );
        }

        // Render app
        try {
            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        } catch (error) {
            document.getElementById('root').innerHTML = '<p style="color: red; padding: 20px;">Failed to load the application. Please refresh the page.</p>';
        }
    </script>
</body>
</html>
