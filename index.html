<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Independent Directors Data Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [searchQuery, setSearchQuery] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('directory');
            const [directors, setDirectors] = React.useState([
                { id: 1, name: 'Pawan Singh', role: 'Financial & Corporate Governance Expert', bio: 'Experienced director specializing in international risk management and strategic scaling.' },
                { id: 2, name: 'Dr. Anita Sharma', role: 'Technology & Digital Transformation', bio: 'Expert in guiding corporate boards through cybersecurity, AI integration, and digital roadmaps.' },
                { id: 3, name: 'Robert Chen', role: 'ESG & Sustainability Leader', bio: 'Advising global corporations on sustainable growth, ESG compliance, and board governance.' }
            ]);
            const [formData, setFormData] = React.useState({ name: '', role: '', bio: '' });
            const [successMsg, setSuccessMsg] = React.useState(false);

            const filteredDirectors = directors.filter(d => 
                d.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                d.role.toLowerCase().includes(searchQuery.toLowerCase())
            );

            const handleSubmit = (e) => {
                e.preventDefault();
                const newDirector = {
                    id: directors.length + 1,
                    name: formData.name,
                    role: formData.role,
                    bio: formData.bio || 'Verified Independent Board Member.'
                };
                setDirectors([newDirector, ...directors]);
                setFormData({ name: '', role: '', bio: '' });
                setSuccessMsg(true);
                setTimeout(() => {
                    setSuccessMsg(false);
                    setActiveTab('directory');
                }, 1500);
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        {/* Header */}
                        <header className="bg-white border-b border-slate-200 sticky top-0 z-50">
                            <div className="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
                                <div className="flex items-center space-x-3">
                                    <div className="bg-indigo-900 text-white font-bold h-10 w-10 rounded-lg flex items-center justify-center text-lg">G</div>
                                    <div>
                                        <h1 className="font-bold text-slate-900 text-lg leading-tight">Global Independent</h1>
                                        <p className="text-xs text-slate-500 font-medium tracking-wider uppercase">Directors Data Bank</p>
                                    </div>
                                </div>
                                <nav className="flex space-x-3">
                                    <button 
                                        onClick={() => setActiveTab('directory')}
                                        className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'directory' ? 'bg-indigo-50 text-indigo-900' : 'text-slate-600 hover:text-slate-900'}`}
                                    >
                                        Directory
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab('register')}
                                        className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'register' ? 'bg-indigo-900 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm'}`}
                                    >
                                        Register Profile
                                    </button>
                                </nav>
                            </div>
                        </header>

                        {/* Hero Section */}
                        <section className="bg-indigo-950 text-white py-16 px-6 text-center">
                            <div className="max-w-3xl mx-auto">
                                <h2 className="text-3xl md:text-4xl font-extrabold tracking-tight mb-3">Connecting Elite Board Leadership</h2>
                                <p className="text-indigo-200 text-base md:text-lg">A streamlined platform linking qualified independent directors with forward-thinking governance boards.</p>
                            </div>
                        </section>

                        {/* Main Content */}
                        <main className="max-w-7xl mx-auto px-6 py-12">
                            {activeTab === 'directory' ? (
                                <div>
                                    <div className="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
                                        <div>
                                            <h3 className="text-2xl font-bold text-slate-900">Verified Directors Directory</h3>
                                            <p className="text-slate-500 text-sm">Browse professional profiles ready for immediate board appointment.</p>
                                        </div>
                                        <div className="w-full md:w-80">
                                            <input 
                                                type="text" 
                                                placeholder="Search by name or expertise..." 
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                                className="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                            />
                                        </div>
                                    </div>

                                    {filteredDirectors.length === 0 ? (
                                        <div className="text-center py-16 bg-white rounded-xl border border-slate-200">
                                            <p className="text-slate-500">No directors found matching your search.</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            {filteredDirectors.map((director) => (
                                                <div key={director.id} className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between hover:border-indigo-300 transition">
                                                    <div>
                                                        <div className="flex items-center justify-between mb-2">
                                                            <h4 className="font-bold text-slate-900 text-lg">{director.name}</h4>
                                                            <span className="bg-emerald-50 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-medium">Verified</span>
                                                        </div>
                                                        <p className="text-xs text-indigo-600 font-semibold mb-3">{director.role}</p>
                                                        <p className="text-slate-600 text-sm leading-relaxed mb-6">{director.bio}</p>
                                                    </div>
                                                    <button onClick={() => alert(`Viewing full credentials for ${director.name}`)} className="w-full bg-slate-50 border border-slate-200 text-slate-700 font-medium py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-900 hover:border-indigo-200 text-sm transition">
                                                        View Full Profile
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="max-w-xl mx-auto bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
                                    <div className="text-center mb-6">
                                        <h3 className="text-2xl font-bold text-slate-900">Director Registration Portal</h3>
                                        <p className="text-slate-500 text-sm mt-1">Submit your details to list your profile on the data bank.</p>
                                    </div>

                                    {successMsg && (
                                        <div className="mb-6 bg-emerald-50 border border-emerald-200 text-emerald-700 p-4 rounded-lg text-sm text-center font-medium">
                                            Profile registered successfully! Redirecting...
                                        </div>
                                    )}

                                    <form onSubmit={handleSubmit} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Full Name</label>
                                            <input 
                                                type="text" 
                                                required 
                                                value={formData.name}
                                                onChange={(e) => setFormData({...formData, name: e.target.value})}
                                                className="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                                                placeholder="e.g. Jane Doe"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Area of Expertise / Role</label>
                                            <input 
                                                type="text" 
                                                required 
                                                value={formData.role}
                                                onChange={(e) => setFormData({...formData, role: e.target.value})}
                                                className="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                                                placeholder="e.g. Corporate Finance & Risk Management"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Professional Summary / Bio</label>
                                            <textarea 
                                                rows="3"
                                                value={formData.bio}
                                                onChange={(e) => setFormData({...formData, bio: e.target.value})}
                                                className="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                                                placeholder="Brief overview of your board experience..."
                                            ></textarea>
                                        </div>
                                        <button type="submit" className="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition shadow-sm text-sm">
                                            Publish Registration
                                        </button>
                                    </form>
                                </div>
                            )}
                        </main>
                    </div>

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-12">
                        <p>&copy; 2026 Global Independent Directors Data Bank. All rights reserved.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
